services:
  api:
    build: ./api
    environment:
      SANKET_DB: /data/sanket.db
    volumes: ["sanketData:/data"]
    command: ["sh", "-c", "python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:8000:8000"]

  app:
    build: ./app
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api]

volumes:
  sanketData:
